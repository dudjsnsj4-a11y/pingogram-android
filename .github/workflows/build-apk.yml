name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  apk:
    name: fast arm64 apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Write secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "${TELEGRAM_API_ID:-0}" "${TELEGRAM_API_HASH:-00000000000000000000000000000000}" \
            > secrets.properties

      - name: Assemble fast APK
        run: ./gradlew :app:assembleFossBenchmarkRelease --stacktrace --no-daemon

      - name: Publish the download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/foss/benchmarkRelease -name '*arm64-v8a*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" Pingogram-fast-arm64.apk
          sha256sum Pingogram-fast-arm64.apk > Pingogram-fast-arm64.apk.sha256
          cp "$apk" Pingogram-custom-api-debug-arm64.apk
          sha256sum Pingogram-custom-api-debug-arm64.apk > Pingogram-custom-api-debug-arm64.apk.sha256
          gh release upload apk-latest \
            Pingogram-fast-arm64.apk Pingogram-fast-arm64.apk.sha256 \
            Pingogram-custom-api-debug-arm64.apk Pingogram-custom-api-debug-arm64.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit apk-latest --repo "$GITHUB_REPOSITORY" \
            --notes "Release-like (R8, no debug tools) arm64-v8a build of the fork with the pre-login Telegram API credentials screen. Signed with the debug key; installs alongside the official Pingogram release."

      - name: Upload fast APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pingogram-fast-arm64
          path: app/build/outputs/apk/foss/benchmarkRelease/*arm64-v8a*.apk
          retention-days: 14
